# Development stack: postgres, redis, S3 (RustFS), vault (dev mode), hydra, mailpit.
# Start:  docker compose -f materials/docker-compose.dev.yaml up -d --wait
# The app itself runs on the host (`scripts/dev.sh all`).
name: ihsp-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ihsp
      POSTGRES_PASSWORD: ihsp
      POSTGRES_DB: postgres # init.sql creates ihsp, ihsp_test and hydra
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihsp -d hydra"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible server. MinIO images are no longer distributed, so dev uses RustFS
  # (docs/reference/jobs-storage-vault.md § 2). The app talks plain S3 (settings S3__*).
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio12345
    ports:
      - "9000:9000"
      - "9001:9001" # console
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  s3-init:
    image: python:3.13-slim
    command:
      - sh
      - -c
      - pip install -q --disable-pip-version-check aiobotocore==3.9.2 && python /init/init.py
    environment:
      S3_ENDPOINT_URL: http://s3:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: ihsp-dev
      S3_CORS_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006
    volumes:
      - ./s3:/init:ro
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  vault:
    image: hashicorp/vault:2.1
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Dev mode keeps nothing on disk: the bootstrap runs on every `up`.
  vault-init:
    image: python:3.13-slim
    command:
      - sh
      - -c
      - pip install -q --disable-pip-version-check hvac==2.4.0 && python /init/setup.py
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root
    volumes:
      - ./vault:/init:ro
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: migrate -c /etc/config/hydra/hydra.yml sql up -e --yes
    environment:
      DSN: postgres://ihsp:ihsp@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - ./hydra/hydra.dev.yml:/etc/config/hydra/hydra.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hydra:
    image: oryd/hydra:v26.2.0
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    environment:
      DSN: postgres://ihsp:ihsp@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
    ports:
      - "4444:4444" # public
      - "4445:4445" # admin: development only, never publish in production
    volumes:
      - ./hydra/hydra.dev.yml:/etc/config/hydra/hydra.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # token hook calls the app on the host
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4445/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pg_data:
  redis_data:
  s3_data:
