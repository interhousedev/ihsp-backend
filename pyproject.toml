[project]
name = "ihsp-backend"
version = "0.1.0"
description = "IHSP backend: modular monolith (identity, academic, files, links, notify, admin, ai, flashcards, mail, lms)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiobotocore==3.9.2",
    "aiogram[redis]>=3.31",
    "aiosmtpd>=1.4.6",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "dkimpy>=1.1.8",
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "joserfc>=1.7.5",
    "mcp>=1.30,<2",
    "nh3>=0.3.7",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "pyspf>=2.0.14",
    "python-docx>=1.2.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "pywebpush>=2.5.0",
    "redis>=7.0,<8",
    "regex>=2026.9.29",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "structlog>=26.1.0",
    "taskiq>=0.12.6,<0.13",
    "taskiq-redis==1.2.2",
    "tzdata>=2026.5",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "black>=26.10.0",
    "fakeredis>=2.39.0",
    "flake8>=7.4.1",
    "flake8-annotations>=3.3.0",
    "flake8-bugbear>=26.9.30",
    "flake8-comprehensions>=3.17.0",
    "flake8-docstrings>=1.7.0",
    "flake8-return>=1.2.0",
    "hypothesis>=6.168.5",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pep8-naming>=0.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
py_version = 313
sections = ["FUTURE", "STDLIB", "FIRSTPARTY", "THIRDPARTY", "LOCALFOLDER"]
known_first_party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
module = [
    "hvac",
    "hvac.*",
    "magic",
    "aiosmtpd",
    "aiosmtpd.*",
    "dkim",
    "spf",
    "taskiq_redis",
    "taskiq_redis.*",
    "aiobotocore",
    "aiobotocore.*",
    "botocore",
    "botocore.*",
    "docx",
    "docx.*",
    "openpyxl",
    "openpyxl.*",
    "pypdfium2",
    "pypdfium2.*",
    "icalendar",
    "icalendar.*",
    "pywebpush",
    "py_vapid",
    "http_ece",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["slow: performance tests (notebooks retrieval and chunking)"]
filterwarnings = [
    "ignore::DeprecationWarning:aiobotocore.*",
    "ignore::DeprecationWarning:botocore.*",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
