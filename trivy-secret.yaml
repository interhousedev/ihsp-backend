# Trivy secret-scanner exceptions (picked up from the working directory by default). Exact files only.
#
# The anthropic SDK documents a default credential in its agent API docstrings with the literal
# `{"type": "service_account"}`. The built-in gcp-service-account rule matches that text, in the sources and
# in the one compiled .pyc it reports. Checked for anthropic 1.14.0: every match is that literal, and none of
# these files has a private key or a service-account e-mail address. Review on every anthropic bump; next
# review 2027-05-04. Do not add directories or wildcards: a new match elsewhere must fail the gate.
allow-rules:
  - id: anthropic-sdk-agents-resource
    description: docstring literal, not a credential
    path: '^/?app/\.venv/lib/python3\.13/site-packages/anthropic/resources/beta/agents/agents\.py$'
  - id: anthropic-sdk-agents-resource-pyc
    description: compiled form of the same docstring literal
    path: '^/?app/\.venv/lib/python3\.13/site-packages/anthropic/resources/beta/agents/__pycache__/agents\.cpython-313\.pyc$'
  - id: anthropic-sdk-agent-create-params
    description: docstring literal, not a credential
    path: '^/?app/\.venv/lib/python3\.13/site-packages/anthropic/types/beta/agent_create_params\.py$'
  - id: anthropic-sdk-agent-update-params
    description: docstring literal, not a credential
    path: '^/?app/\.venv/lib/python3\.13/site-packages/anthropic/types/beta/agent_update_params\.py$'
  - id: anthropic-sdk-managed-agent
    description: docstring literal, not a credential
    path: '^/?app/\.venv/lib/python3\.13/site-packages/anthropic/types/beta/beta_managed_agents_agent\.py$'
  - id: anthropic-sdk-managed-session-agent
    description: docstring literal, not a credential
    path: '^/?app/\.venv/lib/python3\.13/site-packages/anthropic/types/beta/beta_managed_agents_session_agent\.py$'
  - id: anthropic-sdk-managed-session-thread-agent
    description: docstring literal, not a credential
    path: '^/?app/\.venv/lib/python3\.13/site-packages/anthropic/types/beta/beta_managed_agents_session_thread_agent\.py$'
