# Alembic configuration: one branch per module, async engine (see migrations/README.md).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/migrations/versions/identity:%(here)s/migrations/versions/academic:%(here)s/migrations/versions/files:%(here)s/migrations/versions/links:%(here)s/migrations/versions/ai:%(here)s/migrations/versions/flashcards:%(here)s/migrations/versions/notify:%(here)s/migrations/versions/admin:%(here)s/migrations/versions/mail:%(here)s/migrations/versions/lms

# The URL comes from the app settings (IHSP_DATABASE__URL) unless it is set here
# or by code (config.set_main_option) or config.attributes["connection"].
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
