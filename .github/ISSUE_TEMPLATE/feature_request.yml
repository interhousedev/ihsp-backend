name: Feature request
description: Suggest a feature or an improvement.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this (student, teacher, curator, librarian, administrator, operator) and what is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen? Include the user-facing text in uz, ru or en if you have it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This changes the API contract (openapi.json) and needs work in iht-web.
        - label: This touches personal data, AI access or another trust boundary.
