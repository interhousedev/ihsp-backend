# Keeps the pinned actions, base images and Python dependencies current: one weekly pull request
# per ecosystem, grouped so that one review covers related updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  # The images of the compose files (PostgreSQL, Redis, Vault, Hydra, nginx, certbot, ...).
  - package-ecosystem: docker
    directory: "/materials"
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
