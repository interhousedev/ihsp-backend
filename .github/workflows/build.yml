# Builds and publishes the ihsp-backend image to GHCR. Runs on pushes to main (merged pull requests),
# on version tags (v*) and by hand (workflow_dispatch: pick the branch or tag in the "Run workflow"
# dialog; the optional input adds one more image tag).
#
# Order, so that no channel tag points at an image that has not been scanned:
#   1. build the candidate on the runner and scan it with Trivy (fails on fixable CRITICAL and HIGH;
#      the full SARIF goes to code scanning),
#   2. push the commit tag (sha-<commit>) with SBOM and provenance attestations,
#   3. attest build provenance, sign the digest (keyless, Sigstore), Syft SBOM attached and attested,
#   4. point the channel tags (branch, semver, latest on main, the manual tag) at the same digest.
name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (optional), for example 1.2.3-rc1"
        required: false
        type: string

permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Image (ihsp-backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless cosign signing and provenance
      attestations: write    # build provenance attestation
      security-events: write # Trivy SARIF to code scanning
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and version
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/ihsp-backend" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_SHA:0:12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit tag of the candidate
        id: candidate
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.image }}
          tags: type=sha,format=long

      # Two builds from one cache: the first stays on the runner and is scanned, the second (a cache
      # hit) pushes with attestations. Nothing reaches the registry before the scan has passed.
      - name: Build the candidate on the runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.candidate.outputs.tags }}
          labels: ${{ steps.candidate.outputs.labels }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan the candidate -> SARIF (all CRITICAL and HIGH, for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.tags }}
          format: sarif
          output: trivy.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          version: v0.76.1
          exit-code: "0"

      - name: Gate on fixable CRITICAL and HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.tags }}
          skip-setup-trivy: true
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Push the commit tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.candidate.outputs.tags }}
          labels: ${{ steps.candidate.outputs.labels }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Upload the scan to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-backend

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Cosign (keyless)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest
        env:
          IMAGE_DIGEST: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      # A Syft SBOM (SPDX JSON) of the pushed digest: a workflow artifact, a GitHub attestation and a
      # cosign attestation on the image (verify with `cosign verify-attestation --type spdxjson`).
      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-ihsp-backend.spdx.json
          upload-release-assets: false

      - name: Attest the SBOM (GitHub)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest the SBOM (cosign, keyless)
        env:
          IMAGE_DIGEST: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE_DIGEST"

      - name: Channel tags (branch, semver, latest on main, manual tag)
        id: channels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag || 'unused' }},enable=${{ inputs.tag != '' }}

      - name: Point the channel tags at the scanned digest
        env:
          TAGS: ${{ steps.channels.outputs.tags }}
          SOURCE_IMAGE: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -eu
          printf '%s\n' "$TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$SOURCE_IMAGE"
          done
