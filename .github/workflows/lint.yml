# Formatting, import order, lint and types on every push (all branches) and every pull request.
# Same commands as scripts/style_check.sh.
name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: uv (same version as the Dockerfile)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked dependencies, dev group included
        run: uv sync --frozen

      - name: Formatting (black)
        run: uv run black --check app tests

      - name: Import order (isort)
        run: uv run isort --check-only app tests

      - name: Lint (flake8)
        run: uv run flake8 app tests

      - name: Types (mypy)
        run: uv run mypy app
